[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satstreak"
version = "0.0.1.dev0"
description = "Identify which satellite made the streak in a night-sky photograph."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaloyan Stefanov" }]
keywords = ["satellite", "astronomy", "astrometry", "tle", "sgp4", "streak"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3",
]

# Added per milestone, so each dependency has to earn its place rather than
# arriving with the scaffolding. HTTP uses the standard library on purpose:
# one download does not justify pulling in an HTTP stack.
dependencies = [
    "skyfield>=1.49",  # SGP4 propagation and topocentric geometry (milestone 2)
    "numpy>=1.26",     # skyfield requires it
]

[project.optional-dependencies]
# Standalone feasibility spikes (spikes/), not part of the library.
spike = ["pillow>=10.0", "requests>=2.31"]
dev = ["pytest>=8.0", "ruff==0.16.4"]

[project.scripts]
satstreak = "satstreak.cli:main"

[project.urls]
Homepage = "https://github.com/kaloyanstefanov66/SatStreak"
Issues = "https://github.com/kaloyanstefanov66/SatStreak/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/satstreak"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
